<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 1rem 2rem;
            background: #16213e;
            text-align: center;
            border-bottom: 1px solid #0f3460;
        }
        header h1 { font-size: 1.4rem; color: #00d4ff; }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            max-width: 75%;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .user { align-self: flex-end; background: #0f3460; }
        .ai { align-self: flex-start; background: #1a1a3e; border: 1px solid #333; }
        #input-area {
            display: flex;
            padding: 1rem;
            gap: 0.5rem;
            background: #16213e;
            border-top: 1px solid #0f3460;
        }
        #prompt {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 1px solid #0f3460;
            border-radius: 8px;
            background: #1a1a2e;
            color: #eee;
            font-size: 1rem;
            outline: none;
            resize: none;
        }
        #prompt:focus { border-color: #00d4ff; }
        button {
            padding: 0.8rem 1.5rem;
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .typing { opacity: 0.6; font-style: italic; }
    </style>
</head>
<body>
    <header>
        <h1>✨ AI Content Generator</h1>
    </header>
    <div id="chat-container">
        <div class="message ai">Hello! I'm your AI content generator. Ask me anything — I can write stories, emails, code, poems, essays, and more. What would you like me to create?</div>
    </div>
    <div id="input-area">
        <textarea id="prompt" rows="1" placeholder="Type your prompt here..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();generate()}"></textarea>
        <button id="send-btn" onclick="generate()">Send</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const promptInput = document.getElementById('prompt');
        const sendBtn = document.getElementById('send-btn');

        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        async function generate() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            addMessage(prompt, 'user');
            promptInput.value = '';
            sendBtn.disabled = true;

            const typingDiv = addMessage('Generating...', 'ai typing');

            try {
                const response = await fetch('/.netlify/functions/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();
                typingDiv.textContent = data.reply || 'Sorry, something went wrong.';
                typingDiv.classList.remove('typing');
            } catch (err) {
                typingDiv.textContent = 'Error: Could not reach the AI service. Please try again.';
                typingDiv.classList.remove('typing');
            }

            sendBtn.disabled = false;
            promptInput.focus();
        }
    </script>
</body>
</html>
